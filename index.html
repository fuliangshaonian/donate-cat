<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>喵财罐 · 猫咪主题捐赠支持</title>
    <!-- Tabler Icons 轻量级图标库 (与登录界面风格一致) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <!-- 趣味中文字体 (卡通可爱) -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e2d4c4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Noto Sans', sans-serif;
            padding: 1.5rem;
        }

        /* 主容器 – 完全继承登录页视觉风格 */
        .login-wrap {
            min-height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #e8ddd0 0%, #c9b8a0 100%);
            border-radius: 32px;
            padding: 2rem;
            width: 100%;
            box-shadow: 0 20px 35px -12px rgba(80, 55, 30, 0.25);
        }

        /* 卡片 – 暖白半透明 + 细腻边框 */
        .login-card {
            background: rgba(255, 252, 248, 0.92);
            border-radius: 28px;
            border: 1px solid rgba(180, 155, 120, 0.4);
            padding: 28px 30px 36px;
            width: 100%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 10px 28px rgba(100, 70, 40, 0.12);
            backdrop-filter: blur(0px);
            transition: all 0.2s ease;
        }

        /* 猫咪装饰小爪印 (右上角) */
        .paw-badge {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 32px;
            height: 32px;
            background: rgba(180, 148, 110, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        /* 猫猫头像区域 */
        .cat-avatar {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }

        .app-title {
            text-align: center;
            font-size: 26px;
            font-weight: 600;
            color: #5a3e2b;
            margin: 0 0 4px;
            letter-spacing: 2px;
            font-family: 'ZCOOL KuaiLe', cursive;
        }

        .app-sub {
            text-align: center;
            font-size: 13px;
            color: #b28a60;
            margin: 0 0 20px;
            letter-spacing: 1px;
            background: rgba(200, 175, 145, 0.2);
            display: inline-block;
            width: auto;
            padding: 4px 12px;
            border-radius: 40px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 捐赠金额快捷区域 (胶囊按钮) */
        .donation-amounts {
            margin: 6px 0 12px;
        }

        .field-label {
            font-size: 12px;
            color: #a08060;
            margin: 0 0 5px 2px;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .amount-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .amt-chip {
            background: rgba(200, 175, 145, 0.2);
            border: 1px solid rgba(180, 145, 105, 0.4);
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 500;
            color: #6b4c2f;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1 0 auto;
            text-align: center;
        }

        .amt-chip:hover {
            background: #dbbc96;
            border-color: #c4a070;
            color: white;
            transform: translateY(-1px);
        }

        .amt-chip.active {
            background: #c89a62;
            border-color: #b58048;
            color: #fff8ef;
            box-shadow: 0 2px 6px rgba(160, 110, 50, 0.2);
        }

        /* 自定义金额输入框 (沿用登录样式) */
        .field-wrap {
            display: flex;
            align-items: center;
            background: rgba(200, 175, 145, 0.15);
            border-radius: 14px;
            border: 1px solid rgba(180, 145, 105, 0.3);
            padding: 0 14px;
            margin-bottom: 18px;
            height: 46px;
            gap: 8px;
            transition: 0.1s;
        }

        .field-wrap:focus-within {
            border-color: #c9a36b;
            background: rgba(210, 180, 140, 0.1);
        }

        .field-wrap input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 15px;
            color: #4f3822;
            width: 100%;
            padding: 0;
            font-weight: 500;
        }

        .field-wrap input::placeholder {
            color: #c7ab87;
            font-weight: normal;
        }

        .field-icon {
            color: #bc8f60;
            font-size: 18px;
        }

        /* 主要赞助按钮 (渐变延续) */
        .btn-login {
            width: 100%;
            height: 48px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(95deg, #c48e55 0%, #dcb17c 100%);
            color: #fffcf5;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(140, 90, 40, 0.15);
            margin: 4px 0 8px;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(100, 60, 25, 0.2);
        }

        /* 分割线区域 */
        .divider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0 16px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(160, 125, 85, 0.3);
        }

        .divider-text {
            font-size: 12px;
            color: #bfa07e;
        }

        /* 二维码区域 (演示+可切换) */
        .qr-section {
            background: rgba(230, 215, 190, 0.3);
            border-radius: 24px;
            padding: 12px 12px 16px;
            margin: 8px 0 8px;
            text-align: center;
        }

        .qr-label {
            font-size: 12px;
            color: #9b7c5c;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .qr-display {
            background: #fffcf4;
            border-radius: 20px;
            padding: 12px;
            display: inline-block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(170, 140, 100, 0.3);
        }

        .qr-image {
            width: 160px;
            height: 160px;
            display: block;
            border-radius: 16px;
            background: #f9f2e4;
            object-fit: contain;
        }

        .qr-switch {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 14px;
        }

        .qr-switch-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 40px;
            transition: all 0.2s;
            background: rgba(200, 175, 145, 0.1);
        }

        .qr-switch-item i {
            font-size: 22px;
            color: #c29464;
        }

        .qr-switch-item span {
            font-size: 11px;
            color: #8b6948;
        }

        .qr-switch-item.active {
            background: #e3cdb0;
            padding: 4px 12px;
        }

        /* 社交/支持渠道 */
        .social-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 10px 0 6px;
        }

        .social-btn {
            width: 42px;
            height: 42px;
            border-radius: 60px;
            border: 1px solid rgba(170, 135, 95, 0.4);
            background: rgba(210, 180, 140, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #b28a60;
            font-size: 20px;
        }

        .social-btn:hover {
            background: rgba(190, 160, 120, 0.35);
            transform: translateY(-2px);
            color: #8b5e3c;
        }

        .register-row {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #b2906e;
        }

        .register-row a {
            color: #cf9f6e;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        /* 底部爪印装饰 */
        .paw-bg {
            position: absolute;
            bottom: 16px;
            left: 16px;
            opacity: 0.12;
            pointer-events: none;
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            .login-card {
                padding: 22px 20px 30px;
            }
            .amt-chip {
                font-size: 13px;
                padding: 6px 12px;
            }
            .qr-image {
                width: 140px;
                height: 140px;
            }
        }

        /* 可爱提示闪烁 */
        .demo-note {
            font-size: 10px;
            text-align: center;
            color: #c2a07a;
            margin-top: 12px;
            border-top: 0.5px dashed #decbad;
            padding-top: 12px;
        }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <!-- 右上角小爪印 -->
        <div class="paw-badge" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <circle cx="8" cy="6" r="2.2" fill="#b8956a"/>

        <!-- 猫咪头像 (同款温暖橘猫) -->
        <div class="cat-avatar">
            <svg width="88" height="88" viewBox="0 0 88 88">
                <ellipse cx="44" cy="50" rx="32" ry="28" fill="#d4bfa0"/>

                <path d="M44 55.5 Q40 58 38 57" stroke="#c07080" stroke-width="1" fill="none"/>

                <line x1="14" y1="59" x2="34" y2="58" stroke="#9a8878" stroke-width="0.8" opacity="0.7"/>
                <line x1="74" y1="55" x2="54" y2="56" stroke="#9a8878" stroke-width="0.8" opacity="0.7"/>
                <line x1="74" y1="59" x2="54" y2="58" stroke="#9a8878" stroke-width="0.8" opacity="0.7"/>
            </svg>
        </div>

        <p class="app-title">🐟 喵财罐</p>
        <p class="app-sub">投喂小鱼干，一起铲屎官大冒险 ✨</p>

        <!-- 捐赠金额快选 -->
        <div class="donation-amounts">
            <div class="field-label">🍗 选择鱼干份量</div>
            <div class="amount-buttons" id="amountGroup">
                <div class="amt-chip" data-amt="9.9">🐾 小鱼干 9.9</div>
                <div class="amt-chip" data-amt="29.9">🐟 猫粮桶 29.9</div>
                <div class="amt-chip" data-amt="59.9">🎁 豪华罐罐 59.9</div>
            </div>
        </div>

        <!-- 自定义金额 (沿用登录风格输入框) -->
        <div class="field-label">✏️ 自定义心意 (¥)</div>
        <div class="field-wrap">
            <i class="ti ti-coin field-icon" aria-hidden="true"></i>
            <input type="number" id="customAmount" placeholder="输入任意金额, 喵喵感谢~" step="1" min="1">

        <!-- 投喂按钮 (主要捐赠) -->

        <!-- 二维码支付区域 (演示切换 微信/支付宝) -->

                <div class="qr-switch-item active" data-pay="wechat">
                    <i class="ti ti-brand-wechat"></i>

                </div>
                <div class="qr-switch-item" data-pay="alipay">
                    <i class="ti ti-brand-alipay"></i>
                    <span>支付宝</span>
                </div>
            </div>

                🧡 演示界面 | 实际部署请替换为真实收款二维码图片

        <!-- 分割线 & 其他支持渠道 -->
        <div class="divider-row">
            <div class="divider-line"></div>
            <span class="divider-text">🍬 其他方式支持</span>
            <div class="divider-line"></div>
        </div>

            <div class="social-btn" title="GitHub 赞助 (模拟)" id="githubSponsorBtn">
                <i class="ti ti-brand-github"></i>
            </div>
            <div class="social-btn" title="Buy Me a Coffee" id="coffeeBtn">
                <i class="ti ti-coffee"></i>
            </div>
            <div class="social-btn" title="爱发电 / 类似支持" id="afdBtn">
                <i class="ti ti-cat"></i>
            </div>
        </div>

        <div class="register-row">
            🐈‍⬛ 您的每一份支持都会变成小鱼干 & 更好的开源项目 · <a id="projectLink">✨ 喵 ~ 项目仓库</a>
        </div>

        <!-- 底部小爪印装饰 -->
        <svg class="paw-bg" width="52" height="52" viewBox="0 0 44 44">
            <circle cx="14" cy="10" r="5" fill="#b8956a"/>
            <circle cx="30" cy="10" r="5" fill="#b8956a"/>
            <circle cx="7" cy="22" r="4" fill="#b8956a"/>
            <circle cx="37" cy="22" r="4" fill="#b8956a"/>
            <ellipse cx="22" cy="34" rx="11" ry="9" fill="#b8956a"/>

<script>
    (function() {
        // 金额快捷选择逻辑 + 联动自定义输入框
        const amtChips = document.querySelectorAll('.amt-chip');
        const customInput = document.getElementById('customAmount');
        const donateBtn = document.getElementById('donateNowBtn');

        // 清除所有高亮
        function clearActiveChip() {
            amtChips.forEach(chip => chip.classList.remove('active'));
        }

        // 金额点击填充到自定义框 (习惯上也可以只选中并填充)
        amtChips.forEach(chip => {
            chip.addEventListener('click', function(e) {
                const amt = this.getAttribute('data-amt');
                if (customInput) {
                    customInput.value = amt;
                }
                clearActiveChip();
                this.classList.add('active');
            });
        });

        // 如果用户手动输入自定义金额，移除高亮选中效果
        if (customInput) {
            customInput.addEventListener('focus', () => {
                clearActiveChip();
            });
            customInput.addEventListener('input', () => {
                clearActiveChip();
            });
        }

        // 主捐赠按钮 (演示模拟，显示可爱的提示，并展示所选金额)
        function getDonationAmount() {
            let amount = customInput ? customInput.value.trim() : '';
            if (amount === '' || isNaN(amount) || parseFloat(amount) <= 0) {
                // 获取选中的高亮金额按钮值
                let activeChip = document.querySelector('.amt-chip.active');
                if (activeChip) {
                    amount = activeChip.getAttribute('data-amt');
                } else {
                    // 都没有则默认为9.9小鱼干
                    amount = '9.9';
                }
            }
            return parseFloat(amount).toFixed(2);
        }

        donateBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const amount = getDonationAmount();
            // 猫咪风格弹窗 (不做真实支付, 仅演示)
            alert(`🐈 呜喵～ 感谢虚拟捐赠 ¥${amount}！\n（演示模式，实际接入后可完成支付）\n您的支持会变成小鱼干与更多有趣的功能 ✨`);
            // 可以自行拓展后续跳转或埋点，完全符合UI演示需求
        });

        // ---------- 二维码切换 (微信 / 支付宝 模拟占位svg) ----------
        // 设计两个可爱的演示二维码svg (风格一致，便于后续替换真实图片)
        const wechatQrSvg = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23FEF7E8'/%3E%3Crect x='30' y='30' width='60' height='60' fill='%23D9B48B' opacity='0.4'/%3E%3Crect x='110' y='30' width='60' height='60' fill='%23D9B48B' opacity='0.4'/%3E%3Crect x='30' y='110' width='60' height='60' fill='%23D9B48B' opacity='0.4'/%3E%3Crect x='110' y='110' width='60' height='60' fill='%23D9B48B' opacity='0.4'/%3E%3Cpath d='M80 95 L120 95 L100 120 Z' fill='%23c48a5c'/%3E%3Ccircle cx='70' cy='75' r='5' fill='%238b5a3a'/%3E%3Ccircle cx='130' cy='75' r='5' fill='%238b5a3a'/%3E%3Ctext x='42' y='182' font-size='12' fill='%239e6e46'%3E🐱 微信收款示例%3C/text%3E%3Ctext x='44' y='195' font-size='9' fill='%23bc8f62'%3E实际替换二维码%3C/text%3E%3C/svg%3E`;
        const alipayQrSvg = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23FDF2E3'/%3E%3Cpath fill='%23DDB387' opacity='0.3' d='M40,40 L80,40 L80,80 L40,80 Z M120,40 L160,40 L160,80 L120,80 Z M80,120 L120,120 L120,160 L80,160 Z M40,130 L70,130 L70,160 L40,160 Z'/%3E%3Cpath d='M100 85 L110 100 L90 100 Z' fill='%23c98f58'/%3E%3Crect x='130' y='120' width='32' height='32' fill='%23b8834e' opacity='0.5'/%3E%3Ccircle cx='64' cy='64' r='6' fill='%239f6e42'/%3E%3Ctext x='42' y='182' font-size='12' fill='%23a57247'%3E🐟 支付宝示例码%3C/text%3E%3Ctext x='48' y='195' font-size='9' fill='%23bc8f62'%3E部署时替换图片%3C/text%3E%3C/svg%3E`;

        const qrImage = document.getElementById('qrCodeImg');
        const switchItems = document.querySelectorAll('.qr-switch-item');
        let currentPay = 'wechat';   // wechat / alipay

        function updateQrImage(payType) {
            if (payType === 'wechat') {
                qrImage.src = wechatQrSvg;
            } else {
                qrImage.src = alipayQrSvg;
            }
        }

        function setActiveSwitch(payType) {
            switchItems.forEach(item => {
                const pay = item.getAttribute('data-pay');
                if (pay === payType) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        switchItems.forEach(item => {
            item.addEventListener('click', () => {
                const pay = item.getAttribute('data-pay');
                if (pay === 'wechat') {
                    currentPay = 'wechat';
                    updateQrImage('wechat');
                    setActiveSwitch('wechat');
                } else if (pay === 'alipay') {
                    currentPay = 'alipay';
                    updateQrImage('alipay');
                    setActiveSwitch('alipay');
                }
            });
        });

        // 初始化二维码
        updateQrImage('wechat');
        setActiveSwitch('wechat');

        // 其他支持渠道（模拟跳转或提示）
        const githubBtn = document.getElementById('githubSponsorBtn');
        const coffeeBtn = document.getElementById('coffeeBtn');
        const afdBtn = document.getElementById('afdBtn');
        const projectLink = document.getElementById('projectLink');

        if (githubBtn) {
            githubBtn.addEventListener('click', () => {
                alert('🐈‍⬛ 喵~ 这里是GitHub赞助示意界面 (实际可替换为您真实的GitHub Sponsors链接)');
                window.open('https://github.com/sponsors', '_blank');
            });
        }
        if (coffeeBtn) {
            coffeeBtn.addEventListener('click', () => {
                alert('☕️ 请喵喝咖啡～ 实际可绑定 BuyMeACoffee 链接');
                window.open('https://www.buymeacoffee.com', '_blank');
            });
        }
        if (afdBtn) {
            afdBtn.addEventListener('click', () => {
                alert('🎀 爱发电 & 喵粮支持计划，感谢您的心意！');
                window.open('https://afdian.com', '_blank');
            });
        }
        if (projectLink) {
            projectLink.addEventListener('click', (e) => {
                e.preventDefault();
                alert('🧡 本项目为猫咪风格捐赠页面模板，完全开源，欢迎Fork部署！');
                window.open('https://github.com/yourname/donate-page-cat', '_blank');
            });
        }

        // 额外小细节: 点击任意预设金额时, 如果用户之前有自定义输入，将自动填入值并高亮
        // 预置默认高亮第一个金额 (可选)
        if (amtChips.length > 0 && (!customInput.value || customInput.value === '')) {
            amtChips[0].classList.add('active');
            customInput.value = amtChips[0].getAttribute('data-amt');
        }
    })();
</script>
